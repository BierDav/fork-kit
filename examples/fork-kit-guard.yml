# For forks synced centrally (README, "Central sync"): copy to
# .github/workflows/fork-kit.yml in your fork, replace `patched` with your fork
# branch, and pin fork-kit to a commit SHA. The fork holds no App key; the
# guard needs only GITHUB_TOKEN. Keep the file name: the central sync leaves
# this workflow's runs out of the fork branch's checks by that path.
name: fork-kit

on:
  # The guard runs the workflow as defined on the base branch and never checks
  # out the pull request's code, so the PR's content cannot change what it does.
  # labeled/unlabeled: the fork-kit:hold label takes effect at once.
  pull_request_target:
    branches: [patched]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  # Sets the fork-kit/hold status on every PR into the fork branch: it fails
  # while the PR has the fork-kit:hold label (require it in the branch's
  # ruleset). On the sync PR, also turns auto-merge off when someone other
  # than fork-kit pushed to it.
  guard:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    concurrency:
      group: fork-kit-guard-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The base branch, not the pull request: nothing from the PR is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: BierDav/fork-kit@SHA # vX.Y.Z
        with:
          command: guard
          token: ${{ github.token }}
